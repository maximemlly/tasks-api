name: docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Calculer le propriétaire en minuscules et la version
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/tasks-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer le conteneur et faire le test de fumée (staging)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          docker run -d --name api -p 8000:8000 "ghcr.io/${OWNER}/tasks-api:${SHA_TAG}"
          for i in {1..10}; do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/version; then
              echo ""
              echo "Smoke test staging OK"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer le conteneur et faire le test de fumée (production)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          docker run -d --name api -p 8000:8000 "ghcr.io/${OWNER}/tasks-api:${VERSION}"
          for i in {1..10}; do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/version; then
              echo ""
              echo "Smoke test production OK"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

