name: secret-demo

on: workflow_dispatch

jobs:
  secret-check:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier et afficher le secret et la variable
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Erreur : DEMO_TOKEN est vide"
            exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Valeur du secret : $DEMO_TOKEN"
          echo "Environnement (APP_ENV) : ${{ vars.APP_ENV }}"
